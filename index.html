<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dust &amp; Iron</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1410; }
  canvas { display: block; }
  #hud {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: none;
    font: 500 15px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #e8d9b8; text-shadow: 0 1px 3px #000;
  }
  #hud h1 { margin: 0 0 .3em; font-size: 34px; letter-spacing: .18em; color: #d9a441; }
  #hud p { margin: .15em; opacity: .75; }
</style>
</head>
<body>
<div id="hud">
  <h1>DUST &amp; IRON</h1>
  <p>round 0 — assets staged</p>
  <p id="status">booting…</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
// Round 0 boot page. Proves the import map, WebGL context and render loop all
// work before Round 1 builds the world on top of them. Round 1 replaces this
// inline script with /src/main.js.
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a1d16);
scene.fog = new THREE.FogExp2(0x2a1d16, 0.02);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 1.2, 4);

scene.add(new THREE.HemisphereLight(0xd9a441, 0x2a1d16, 1.4));
const sun = new THREE.DirectionalLight(0xffe6b8, 2.0);
sun.position.set(3, 5, 2);
scene.add(sun);

// Placeholder marker, not a game object — Round 1 owns real scene content.
const marker = new THREE.Mesh(
  new THREE.TorusKnotGeometry(0.7, 0.22, 128, 24),
  new THREE.MeshStandardMaterial({ color: 0xb06a3b, roughness: 0.55, metalness: 0.15 })
);
scene.add(marker);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// scripts/smoke.mjs reads these to confirm the loop actually ran.
window.__frames = 0;
window.__ready = true;

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  marker.rotation.set(t * 0.3, t * 0.5, 0);
  renderer.render(scene, camera);
  window.__frames++;
});

document.getElementById('status').textContent = `three.js r${THREE.REVISION} — running`;
</script>
</body>
</html>
